<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <h1>Auto-cropping Logos</h1>
  <div id="status">Starting...</div>
  <script>
    async function cropImage(src, targetPath) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;

          let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;

          // Find non-white / non-transparent bounding box
          for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {
              const idx = (y * canvas.width + x) * 4;
              const r = data[idx];
              const g = data[idx + 1];
              const b = data[idx + 2];
              const a = data[idx + 3];

              // If pixel is not pure white/almost white and not transparent
              const isWhiteOrTransparent = (a < 20) || (r > 248 && g > 248 && b > 248);
              if (!isWhiteOrTransparent) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }

          console.log(src, { minX, maxX, minY, maxY, w: maxX - minX, h: maxY - minY });

          // Add subtle 4px margin
          const pad = 6;
          const cropX = Math.max(0, minX - pad);
          const cropY = Math.max(0, minY - pad);
          const cropW = Math.min(canvas.width - cropX, (maxX - minX) + pad * 2);
          const cropH = Math.min(canvas.height - cropY, (maxY - minY) + pad * 2);

          const cropCanvas = document.createElement('canvas');
          cropCanvas.width = cropW;
          cropCanvas.height = cropH;
          const cropCtx = cropCanvas.getContext('2d');
          cropCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

          const dataUrl = cropCanvas.toDataURL('image/png');

          // Send to server
          const resp = await fetch('http://localhost:5502/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              path: targetPath,
              image: dataUrl
            })
          });
          const res = await resp.json();
          resolve(res);
        };
        img.onerror = reject;
        img.src = src;
      });
    }

    async function run() {
      try {
        document.getElementById('status').innerText = 'Cropping Xiaomi...';
        await cropImage('../assets/img/trusted-bar/xioami logo bar.png', 'assets/img/trusted-bar/xioami logo bar.png');

        document.getElementById('status').innerText = 'Cropping Honor...';
        await cropImage('../assets/img/trusted-bar/honor logo bar.jpeg', 'assets/img/trusted-bar/honor logo bar.jpeg');

        document.getElementById('status').innerText = 'SUCCESS! Both logos cropped tightly.';
      } catch (e) {
        document.getElementById('status').innerText = 'Error: ' + e.message;
      }
    }

    window.addEventListener('load', run);
  </script>
</body>
</html>
