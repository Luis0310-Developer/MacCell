<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body style="background:#fff; padding:20px;">
  <h2>Testing official Samsung Wordmark</h2>
  <div id="container" style="border: 2px solid red; display: inline-block;">
    <!-- embed svg directly -->
  </div>
  <pre id="output"></pre>
  <script>
    fetch('../samsung_wordmark_clean.svg')
      .then(r => r.text())
      .then(svgText => {
        document.getElementById('container').innerHTML = svgText;
        const svgEl = document.querySelector('svg');
        const path = document.querySelector('path#path20');
        const bbox = path.getBBox();
        const svgBox = svgEl.getBBox();
        const clientRect = svgEl.getBoundingClientRect();
        document.getElementById('output').innerText = JSON.stringify({
          pathBBox: { x: bbox.x, y: bbox.y, width: bbox.width, height: bbox.height },
          svgBBox: { x: svgBox.x, y: svgBox.y, width: svgBox.width, height: svgBox.height },
          clientRect: clientRect
        }, null, 2);
      });
  </script>
</body>
</html>
