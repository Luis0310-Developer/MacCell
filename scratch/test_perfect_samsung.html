<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background: #f8fafc;
    padding: 30px;
    font-family: system-ui, sans-serif;
  }
  .card-container {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  /* Desktop card */
  .marquee-card {
    width: 190px;
    height: 90px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 18px;
    box-sizing: border-box;
  }
  /* Mobile card */
  .marquee-card.mobile {
    width: 165px;
    height: 75px;
    padding: 8px 12px;
  }
  .samsung-img {
    max-height: 28px;
    max-width: 135px;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .samsung-img.mobile {
    max-height: 22px;
    max-width: 125px;
  }
</style>
</head>
<body>
  <h2>Desktop Card (190x90)</h2>
  <div class="card-container">
    <div class="marquee-card">
      <img src="clean_samsung.svg" class="samsung-img" alt="Samsung">
    </div>
  </div>

  <h2>Mobile Card (165x75)</h2>
  <div class="card-container">
    <div class="marquee-card mobile">
      <img src="clean_samsung.svg" class="samsung-img mobile" alt="Samsung">
    </div>
  </div>
</body>
</html>
