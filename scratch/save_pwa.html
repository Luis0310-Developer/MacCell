<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <h1>Generating PWA Icons</h1>
  <div id="status">Working...</div>
  <script>
    async function makeIcon(size, targetPath) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, size, size);

          const dataUrl = canvas.toDataURL('image/png');
          const resp = await fetch('http://localhost:5503/save-icon', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: targetPath, image: dataUrl })
          });
          const res = await resp.json();
          resolve(res);
        };
        img.onerror = reject;
        img.src = '../assets/img/ui/Logo.jpeg';
      });
    }

    async function run() {
      try {
        await makeIcon(192, 'assets/img/pwa/icon-192.png');
        await makeIcon(512, 'assets/img/pwa/icon-512.png');
        document.getElementById('status').innerText = 'PWA_ICONS_SAVED_SUCCESS';
      } catch (err) {
        document.getElementById('status').innerText = 'ERROR: ' + err.message;
      }
    }

    window.addEventListener('load', run);
  </script>
</body>
</html>
